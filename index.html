<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gate-bg-1: #221d33;
    --gate-bg-2: #07060d;
    --paper-100: #efe3c8;
    --paper-50: #f7f0dd;
    --paper-ink: #3b2a20;
    --paper-ink-dim: #6e5847;
    --gold-500: #d4a24c;
    --gold-bg: #221a12;
    --gold-bg-2: #3d2c18;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; overscroll-behavior: none; }
  body {
    font-family: var(--sans);
    background: var(--paper-100);
    color: var(--paper-ink);
  }
  body.locked { overflow: hidden; height: 100vh; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ================= GATE (envelope, locked screen) ================= */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 38%, var(--gate-bg-1) 0%, var(--gate-bg-2) 78%);
    transition: opacity 0.9s ease;
  }
  #gate.opened { opacity: 0; pointer-events: none; }

  .stage {
    position: relative;
    width: min(360px, 78vw);
  }

  .envelope-btn {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.7s cubic-bezier(.4,0,.2,1), opacity 0.6s ease;
  }
  .stage.open .envelope-btn { transform: translateY(35%) scale(0.92); opacity: 0; }

  .envelope-photo {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 3px;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.65));
  }

  .paper-peek-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 3px;
    z-index: 1;
  }
  .paper-peek {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 82%;
    transform: translate(-50%, 105%);
    border-radius: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.8s cubic-bezier(.3,1.1,.4,1) 0.12s;
  }
  .stage.open .paper-peek { transform: translate(-50%, -58%); }

  .photo-missing {
    width: min(360px, 78vw);
    aspect-ratio: 3 / 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    border: 1.5px dashed rgba(255,255,255,0.35);
    border-radius: 4px;
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    font-family: var(--sans);
  }
  .photo-missing strong {
    display: block;
    font-family: var(--serif);
    font-size: 1rem;
    color: rgba(255,255,255,0.9);
    margin-bottom: 0.4rem;
  }
  .photo-missing code {
    background: rgba(255,255,255,0.12);
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
  }

  /* ================= LETTER ================= */
  .letter-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5rem 1.5rem 6rem;
    background: linear-gradient(180deg, var(--gate-bg-2) 0%, var(--gate-bg-1) 14%, var(--paper-100) 42%);
  }

  .pages {
    max-width: 700px;
    width: 100%;
  }

  .paper-sheet {
    border-radius: 2px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.35);
    margin-bottom: 1.6rem;
    overflow: hidden;
  }
  .paper-sheet:last-child { margin-bottom: 0; }

  .ink-overlay {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }

  .page-missing {
    min-height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--paper-ink-dim);
    font-size: 0.9rem;
    border: 1.5px dashed rgba(59,42,32,0.35);
    border-radius: 2px;
    padding: 2rem;
    background: var(--paper-50);
  }
  .page-missing strong {
    display: block;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--paper-ink);
    margin-bottom: 0.4rem;
  }
  .page-missing code {
    background: rgba(59,42,32,0.08);
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
  }

  /* ================= LIGHTBOX ================= */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(7, 6, 13, 0.94);
    z-index: 50;
    display: none;
    overflow: auto;
    padding: 3.5rem 1rem 2rem;
    text-align: center;
  }
  .lightbox.open { display: block; }
  .lightbox img {
    width: 900px;
    max-width: none;
    border-radius: 2px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: fixed;
    top: 1rem;
    right: 1.2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 51;
  }
  .lightbox-hint {
    color: rgba(255,255,255,0.55);
    font-size: 0.82rem;
    margin-bottom: 1rem;
  }

  /* ================= BIRTHDAY ================= */
  .birthday-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: 5rem 1.5rem;
    background: radial-gradient(ellipse at 50% 30%, var(--gold-bg-2) 0%, var(--gold-bg) 75%);
    text-align: center;
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  .banner {
    background: var(--paper-50);
    border-radius: 2px;
    padding: 1.6rem 2.4rem;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    background-image: repeating-linear-gradient(
      to bottom, transparent 0, transparent 37px,
      rgba(59,42,32,0.16) 38px, transparent 39px
    );
  }
  .banner h2 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    color: var(--paper-ink);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0;
  }

  .cake-btn {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
