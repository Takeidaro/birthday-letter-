<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050507;
    --near-black: #0c0b10;
    --paper-ink: #3b2a20;
    --paper-ink-dim: #6e5847;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overscroll-behavior: none; background: var(--black); }
  body { font-family: var(--sans); color: #e8e2f0; }
  body.locked { overflow: hidden; height: 100vh; }

  /* ================= SCENE 1 — 3D ENVELOPE ================= */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(ellipse at 50% 38%, var(--near-black) 0%, var(--black) 78%);
    transition: opacity 0.9s ease;
  }
  #gate.opened { opacity: 0; pointer-events: none; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }
  #gate-msg {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(2rem + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.45);
    padding: 0 1.5rem;
    pointer-events: none;
  }
  #gate-msg .err { color: #ffb4a3; line-height: 1.7; margin-bottom: 0.8rem; }
  #gate-msg button {
    pointer-events: auto;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.55rem 1.3rem;
    border-radius: 999px;
    border: 1px solid #d4a24c;
    background: transparent;
    color: #d4a24c;
    cursor: pointer;
  }

  /* ================= SCENE 2 — LETTER ================= */
  .letter-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5rem 1.2rem 40vh;
    background: var(--black);
    transition: opacity 0.2s linear;
  }
  .pages { max-width: 640px; width: 100%; }
  .paper-sheet { position: relative; line-height: 0; }
  .paper-sheet + .paper-sheet::before {
    content: '';
    position: absolute;
    top: -14px; left: 0; right: 0; height: 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.16), transparent);
    z-index: 1;
  }
  .ink-overlay { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .page-missing, .photo-missing {
    min-height: 340px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    color: var(--paper-ink-dim);
    font-size: 0.9rem;
    border: 1.5px dashed rgba(255,255,255,0.2);
    padding: 2rem;
    background: #efe6d2;
    line-height: 1.6;
  }
  .photo-missing { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); min-height: 240px; }
  .page-missing strong, .photo-missing strong {
    display: block; font-family: var(--serif); font-size: 1.05rem; font-weight: 500; margin-bottom: 0.4rem;
  }
  .page-missing strong { color: var(--paper-ink); }
  .photo-missing strong { color: rgba(255,255,255,0.9); }
  .page-missing code, .photo-missing code {
    background: rgba(128,128,128,0.18); padding: 0.1rem 0.4rem; border-radius: 3px;
  }

  /* ================= LIGHTBOX ================= */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(5,5,7,0.96);
    z-index: 50; display: none; overflow: auto;
    padding: 3.5rem 1rem 2rem; text-align: center;
  }
  .lightbox.open { display: block; }
  .lightbox img { width: 900px; max-width: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: fixed; top: 1rem; right: 1.2rem;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 1.3rem; cursor: pointer; z-index: 51;
  }
  .lightbox-hint { color: rgba(255,255,255,0.5); font-size: 0.82rem; margin-bottom: 1rem; }

  /* ================= SCENE 3 — BIRTHDAY ================= */
  .birthday-section { height: 200vh; position: relative; background: var(--black); }
  .birthday-sticky {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.8rem; text-align: center; overflow: hidden;
  }
  .light-spread {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 62%, rgba(230,160,70,0.9) 0%, rgba(120,70,30,0.4) 30%, rgba(0,0,0,0) 65%);
    opacity: 0; transform: scale(0.3);
    transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2,.8,.3,1);
    pointer-events: none;
  }
  .birthday-sticky.lit .light-spread { opacity: 1; transform: scale(1); }
  .flame-glow {
    position: absolute; top: 34%; left: 50%;
    width: 90px; height: 90px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,200,110,0.95) 0%, rgba(255,150,60,0.5) 35%, rgba(255,120,40,0) 70%);
    filter: blur(2px);
    animation: flicker 1.8s ease-in-out infinite;
    pointer-events: none; opacity: 0;
  }
  @keyframes flicker {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.08); }
  }
  .cake-btn { position: relative; border: none; background: none; padding: 0; cursor: pointer; z-index: 2; }
  .cake-photo {
    width: min(360px, 80vw); height: auto;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.6)) brightness(0.9);
    transition: filter 1.2s ease, opacity 0.25s linear;
  }
  .birthday-sticky.lit .cake-photo { filter: drop-shadow(0 25px 35px rgba(0,0,0,0.4)) brightness(1.15); }
  .banner {
    position: relative; z-index: 2;
    background: #f7f0dd; padding: 1.4rem 2.2rem;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 37px, rgba(59,42,32,0.16) 38px, transparent 39px);
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .birthday-sticky.lit .banner { opacity: 1; transform: translateY(0); }
  .banner h2 {
    font-family: var(--serif); font-style: italic; font-weight: 500;
    color: var(--paper-ink); font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 0;
  }
  .birthday-message {
    position: relative; z-index: 2; max-width: 38ch;
    color: #e6d3a8; font-size: 1rem; line-height: 1.7;
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.9s ease 0.15s, transform 0.9s ease 0.15s;
  }
  .birthday-sticky.lit .birthday-message { opacity: 1; transform: translateY(0); }
  .tap-hint { position: relative; z-index: 2; font-size: 0.78rem; color: #9c8863; transition: opacity 0.4s ease; }
</style>
</head>
<body class="locked">

<!-- SCENE 1: 3D envelope (loads envelope.glb directly) -->
<div id="gate">
  <canvas id="gl"></canvas>
  <div id="gate-msg">読み込み中…</div>
</div>

<!-- SCENE 2: letter (image pages) -->
<section class="letter-section" id="letter-section">
  <div class="pages" id="pages">
    <!-- page-1.png, page-2.png, page-3.png ... : ruled paper + your handwriting,
         composited in ibis Paint and exported as one image per page. -->
    <div class="paper-sheet" style="background: #ccc; min-height: 400px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;">
      <span style="color: #333; font-weight: bold;">手紙 1ページ目（ここに画像が入ります）</span>
    </div>
    <div class="paper-sheet" style="background: #ccc; min-height: 400px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;">
      <span style="color: #333; font-weight: bold;">手紙 2ページ目（ここに画像が入ります）</span>
    </div>
    <div class="paper-sheet" style="background: #ccc; min-height: 400px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;">
      <span style="color: #333; font-weight: bold;">手紙 3ページ目（ここに画像が入ります）</span>
    </div>

</section>



<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <p class="lightbox-hint">scroll and pinch to zoom · tap outside to close</p>
  <img id="lightbox-img" src="" alt="Letter page, enlarged">
</div>

<!-- SCENE 3: birthday cake -->
<section class="birthday-section" id="birthday-section">
  <div class="birthday-sticky" id="birthday-sticky">
    <div class="light-spread"></div>
    <div class="flame-glow" id="flame-glow"></div>
    <div class="banner"><h2>Happy Birthday</h2></div>
    <button class="cake-btn" id="cake-btn" aria-label="ケーキをタップ">
      <!-- real photo of the cake with the "22" candles lit: cake-lit.jpg -->
<div class="cake-photo" id="cake-photo" style="background: #ddd; width: 100%; max-width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
  <span style="color: #333; font-weight: bold;">ケーキの写真（ここに画像が入ります）</span>
</div>

    </button>
    <p class="tap-hint" id="tap-hint">tap the cake</p>
    <p class="birthday-message">
      Whatever the distance is right now, I wanted you to have this anyway.
      Happy birthday — I'm so glad I get to know you.
    </p>
  </div>
</section>

<!-- three.js r128, classic scripts (no ES modules) -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
  /* ============================================================
     SETTINGS — all the numbers you tuned live here.
     ============================================================ */
  const CONFIG = {
    modelUrl: 'letter3D.glb',
    modelVersion: 5,            // bump this when you upload a new envelope.glb (avoids stale cache)

    // pose & controls
    restTiltDeg: 30,            // how far the envelope leans back from facing you
    dragRadPerPx: 0.0075,       // rotation per pixel dragged
    invertDrag: false,          // true = reverse the drag direction
    pitchLimitDeg: 35,          // up/down tilt limit while dragging
    returnSpeed: 4.0,           // how fast it snaps back to the front (bigger = faster)
    tapSlopPx: 10,              // moved less than this = a tap, not a drag
    tapAssistPx: 46,            // extra tap area around the seal (fingers are big)

    // tuned lighting (from your test bench)
    lighting: { azimuth: 231, elevation: 46, key: 0.85, env: 0.3, exposure: 0.95, toneMapping: 'aces', shadows: true },
    materials: {
      'マテリアル.002': { roughness: 1,   brightness: 1 },
      'マテリアル':     { roughness: 1,   brightness: 1 },
      'マテリアル.003': { roughness: 0.2, brightness: 1 },
      'マテリアル.001': { roughness: 0.4, brightness: 1 }
    },

    // opening animation
    flap: { axis: 'x', flip: true, angleDeg: 141, durationMs: 1700 },
    glow: { style: 'none', color: '#ffb35c', size: 2.15, durationMs: 1200 },  // style: none | soft | flash | ring
    holdAfterOpenMs: 350,       // pause after the flap finishes, before fading to the letter
    fadeMs: 900,                // must match the #gate opacity transition in the CSS

    flapPrefixes: ['フラップ', 'Flap', 'flap'],
    sealPrefixes: ['UV球封蝋', '封蝋', '蓮の花', 'Seal', 'seal']
  };

  /* ---------- helpers used by <img onerror> ---------- */
  function makeMissing(filename, label) {
    const div = document.createElement('div');
    div.className = 'photo-missing';
    div.innerHTML = '<div><strong>' + label + '</strong><span>Save it as <code>' + filename + '</code> next to this file.</span></div>';
    return div;
  }
  function makeMissingPage(n) {
    const div = document.createElement('div');
    div.className = 'page-missing';
    div.innerHTML = '<div><strong>Page ' + n + ' not added yet</strong><span>Save it as <code>page-' + n + '.png</code> next to this file.</span></div>';
    return div;
  }

  /* ============================================================
     SCENE 1 — 3D envelope
     ============================================================ */
  (function () {
    const gate = document.getElementById('gate');
    const canvas = document.getElementById('gl');
    const msg = document.getElementById('gate-msg');

    function showError(text, withPicker) {
      msg.innerHTML = '<div class="err">' + text + '</div>' +
        (withPicker ? '<button id="pick-btn">ファイルを選んで確認する</button><input type="file" id="pick-input" accept=".glb" style="display:none">' : '');
      if (withPicker) {
        const input = document.getElementById('pick-input');
        document.getElementById('pick-btn').addEventListener('click', () => input.click());
        input.addEventListener('change', () => {
          if (input.files[0]) { msg.textContent = '読み込み中…'; loadModel(URL.createObjectURL(input.files[0])); }
        });
      }
    }

    if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
      showError('3Dライブラリを読み込めませんでした。インターネット接続を確認して、ページを再読み込みしてください。', false);
      return;
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    } catch (e) {
      showError('このブラウザでは3D表示ができません。', false);
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    const TONE = { aces: THREE.ACESFilmicToneMapping, linear: THREE.LinearToneMapping, reinhard: THREE.ReinhardToneMapping, none: THREE.NoToneMapping };
    renderer.toneMapping = TONE[CONFIG.lighting.toneMapping] || THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = CONFIG.lighting.exposure;
    renderer.shadowMap.enabled = CONFIG.lighting.shadows;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

    /* rig  = what the finger rotates (yaw / pitch, springs back to 0)
       stand = fixed pose: stands the flat-lying model up and leans it back */
    const rig = new THREE.Group();
    const stand = new THREE.Group();
    scene.add(rig);
    rig.add(stand);
    stand.rotation.x = THREE.MathUtils.degToRad(90 - CONFIG.restTiltDeg);
    const standQuat = stand.quaternion.clone();

    /* ---- lights: set up in the model's own (flat) frame, then turned by the
       stand rotation, so the look you tuned is the look at the rest pose ---- */
    const L = CONFIG.lighting;
    const LIGHT_R = 10.8;
    const key = new THREE.DirectionalLight(0xfff2df, L.key);
    const fill = new THREE.DirectionalLight(0xcdd8ff, 0.15);
    const rim = new THREE.DirectionalLight(0xffffff, 0.3);
    const az = THREE.MathUtils.degToRad(L.azimuth), el = THREE.MathUtils.degToRad(L.elevation);
    key.position.set(LIGHT_R * Math.cos(el) * Math.sin(az), LIGHT_R * Math.sin(el), LIGHT_R * Math.cos(el) * Math.cos(az)).applyQuaternion(standQuat);
    fill.position.set(-1.8, 0.7, 0.6).applyQuaternion(standQuat);
    rim.position.set(0, 1.0, -1.8).applyQuaternion(standQuat);
    key.castShadow = L.shadows;
    const smallScreen = Math.min(window.innerWidth, window.innerHeight) < 600;
    key.shadow.mapSize.set(smallScreen ? 1024 : 2048, smallScreen ? 1024 : 2048);
    const sc = key.shadow.camera;
    sc.left = -4.7; sc.right = 4.7; sc.top = 4.7; sc.bottom = -4.7; sc.near = 0.4; sc.far = 27;
    sc.updateProjectionMatrix();
    key.shadow.bias = -0.0005;
    key.shadow.normalBias = 0.011;
    scene.add(key, fill, rim);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2438, 0.12));
    scene.add(new THREE.AmbientLight(0x404060, 0.05));

    /* ---- soft studio environment so waxy / paper materials have reflections ---- */
    function buildStudioEnvironment() {
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({ color: 0x14121c, side: THREE.BackSide })));
      function panel(w, h, power, pos, color) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }));
        m.position.set(pos[0], pos[1], pos[2]);
        m.lookAt(0, 0, 0);
        envScene.add(m);
      }
      panel(4.5, 3, 5, [3.5, 4, 3.5], 0xfff0dd);
      panel(3.5, 3.5, 1.6, [-5, 1.5, 2.5], 0xcdd8ff);
      panel(6, 1.6, 2.5, [0, 5, -3.5], 0xffffff);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    }

    /* ---- state ---- */
    let modelRoot = null, flap = null, flapBaseQuat = null, sealTargets = [];
    let modelWidth = 3.6;
    const HEIGHT_FIT = 2.5;    // vertical size to keep in view (envelope + the opened flap)
    const st = { yaw: 0, pitch: 0, dragging: false, lastX: 0, lastY: 0, downX: 0, downY: 0, moved: false, locked: false };
    let running = true;

    function fitCamera() {
      const w = gate.clientWidth || window.innerWidth, h = gate.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const needW = (modelWidth * 1.22) / (2 * tanHalf * camera.aspect);
      const needH = (HEIGHT_FIT * 1.15) / (2 * tanHalf);
      const d = Math.max(needW, needH);
      camera.position.set(0, 0, d);
      camera.lookAt(0, 0, 0);
      camera.near = d * 0.05;
      camera.far = d * 6;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', fitCamera);
    window.addEventListener('orientationchange', () => setTimeout(fitCamera, 200));
    fitCamera();

    /* ---- load ---- */
    const loader = new THREE.GLTFLoader();

    function findByPrefixes(root, prefixes) {
      const out = [];
      root.traverse((o) => { if (o.name && prefixes.some((p) => o.name.startsWith(p))) out.push(o); });
      return out;
    }

    function loadModel(url) {
      loader.load(url, onLoaded, (e) => {
        if (e.total > 0) msg.textContent = '読み込み中… ' + Math.round((e.loaded / e.total) * 100) + '%';
        else msg.textContent = '読み込み中… ' + (e.loaded / 1048576).toFixed(1) + 'MB';
      }, (err) => {
        console.error(err);
        showError('3Dモデル(' + CONFIG.modelUrl + ')を読み込めませんでした。<br>' +
          'index.html を直接ダブルクリックで開いている場合は、ブラウザの制限で読み込めません。<br>' +
          'GitHub Pages などのサイト上で開くか、下のボタンでファイルを選んでください。', true);
      });
    }

    function onLoaded(gltf) {
      if (modelRoot) stand.remove(modelRoot);
      modelRoot = gltf.scene;

      // center the model on the origin (measured in its own flat frame, before it is stood up)
      const box = new THREE.Box3().setFromObject(modelRoot);
      const center = box.getCenter(new THREE.Vector3());
      modelWidth = box.getSize(new THREE.Vector3()).x || 3.6;
      modelRoot.position.sub(center);
      stand.add(modelRoot);

      // materials
      const envTex = buildStudioEnvironment();
      const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      const seen = new Set();
      modelRoot.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
          if (!m || seen.has(m.uuid)) return;
          seen.add(m.uuid);
          if (m.isMeshStandardMaterial) {
            m.envMap = envTex;
            m.envMapIntensity = L.env;
            const p = CONFIG.materials[m.name];
            if (p) { m.roughness = p.roughness; m.color.multiplyScalar(p.brightness); }
            ['map', 'normalMap', 'roughnessMap'].forEach((k) => { if (m[k]) m[k].anisotropy = maxAniso; });
            m.needsUpdate = true;
          }
        });
      });

      // flap + seal
      flap = findByPrefixes(modelRoot, CONFIG.flapPrefixes)[0] || null;
      flapBaseQuat = flap ? flap.quaternion.clone() : null;
      sealTargets = findByPrefixes(modelRoot, CONFIG.sealPrefixes).filter((o) => o.isMesh);
      if (!flap || !sealTargets.length) console.warn('flap/seal not found', { flap: flap && flap.name, seals: sealTargets.map((o) => o.name) });

      fitCamera();
      msg.textContent = '';
      requestAnimationFrame(frame);
    }

    loadModel(CONFIG.modelUrl + '?v=' + CONFIG.modelVersion);

    /* ---- drag to turn; let go and it returns to the front ---- */
    function normalizeYaw() {
      st.yaw = ((st.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    }
    const pitchLimit = THREE.MathUtils.degToRad(CONFIG.pitchLimitDeg);

    canvas.addEventListener('pointerdown', (e) => {
      if (st.locked || !modelRoot) return;
      st.dragging = true; st.moved = false;
      st.lastX = st.downX = e.clientX;
      st.lastY = st.downY = e.clientY;
      canvas.classList.add('dragging');
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!st.dragging) return;
      const dx = e.clientX - st.lastX, dy = e.clientY - st.lastY;
      st.lastX = e.clientX; st.lastY = e.clientY;
      if (Math.hypot(e.clientX - st.downX, e.clientY - st.downY) > CONFIG.tapSlopPx) st.moved = true;
      const s = (CONFIG.invertDrag ? -1 : 1) * CONFIG.dragRadPerPx;
      st.yaw += dx * s;
      st.pitch = Math.max(-pitchLimit, Math.min(pitchLimit, st.pitch + dy * s * 0.8));
    });
    function endDrag(e, cancelled) {
      if (!st.dragging) return;
      st.dragging = false;
      canvas.classList.remove('dragging');
      normalizeYaw();
      if (!cancelled && !st.moved) handleTap(e.clientX, e.clientY);
    }
    canvas.addEventListener('pointerup', (e) => endDrag(e, false));
    canvas.addEventListener('pointercancel', (e) => endDrag(e, true));

    /* ---- tap on the seal ---- */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function sealCenterWorld() {
      const b = new THREE.Box3();
      sealTargets.forEach((o) => b.expandByObject(o));
      return b.getCenter(new THREE.Vector3());
    }
    function handleTap(cx, cy) {
      if (st.locked || !flap || !sealTargets.length) return;
      const rect = canvas.getBoundingClientRect();
      ndc.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      let hit = raycaster.intersectObjects(sealTargets, false).length > 0;

      if (!hit) {
        // forgiving tap area around the seal, only while the front of the envelope faces us
        const c = sealCenterWorld();
        const q = modelRoot.getWorldQuaternion(new THREE.Quaternion());
        const normal = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
        const toCam = camera.position.clone().sub(c).normalize();
        if (normal.dot(toCam) > 0.3) {
          const p = c.clone().project(camera);
          const px = (p.x * 0.5 + 0.5) * rect.width + rect.left;
          const py = (-p.y * 0.5 + 0.5) * rect.height + rect.top;
          hit = Math.hypot(px - cx, py - cy) < CONFIG.tapAssistPx;
        }
      }
      if (hit) startOpen();
    }

    /* ---- opening: the flap swings up, then fade to the letter ---- */
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const tmpQ = new THREE.Quaternion();

    function startOpen() {
      st.locked = true;
      const F = CONFIG.flap;
      const axisVec = new THREE.Vector3(F.axis === 'x' ? 1 : 0, F.axis === 'y' ? 1 : 0, F.axis === 'z' ? 1 : 0);
      const angle = (F.flip ? -1 : 1) * THREE.MathUtils.degToRad(F.angleDeg);
      const t0 = performance.now();
      (function step(now) {
        const t = Math.min(1, (now - t0) / F.durationMs);
        tmpQ.setFromAxisAngle(axisVec, angle * easeOutCubic(t));
        flap.quaternion.copy(flapBaseQuat).multiply(tmpQ);
        if (t < 1) { requestAnimationFrame(step); return; }
        spawnGlow();
        setTimeout(goToLetter, CONFIG.holdAfterOpenMs + (CONFIG.glow.style === 'none' ? 0 : Math.min(CONFIG.glow.durationMs, 600)));
      })(t0);
    }

    function goToLetter() {
      gate.classList.add('opened');
      document.body.classList.remove('locked');
      setTimeout(() => {
        gate.style.visibility = 'hidden';
        running = false;
        document.getElementById('pages').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, CONFIG.fadeMs + 50);
    }

    /* ---- optional light effect when the flap finishes ---- */
    let glowObj = null;
    function clearGlow() { if (glowObj) { scene.remove(glowObj.group); glowObj = null; } }
    function spawnGlow() {
      const G = CONFIG.glow;
      if (G.style === 'none') return;
      clearGlow();
      const group = new THREE.Group();
      group.position.copy(sealCenterWorld());
      scene.add(group);
      const color = new THREE.Color(G.color);
      let item;
      if (G.style === 'ring') {
        item = new THREE.Mesh(new THREE.RingGeometry(0.82, 1, 64),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
        item.lookAt(camera.position);
      } else {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const ctx = c.getContext('2d');
        const hex = '#' + color.getHexString();
        const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.25, hex + 'ee'); grad.addColorStop(1, hex + '00');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
        item = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      }
      group.add(item);
      glowObj = { group: group };
      const t0 = performance.now();
      const flash = G.style === 'flash';
      (function step(now) {
        const t = (now - t0) / G.durationMs;
        if (t >= 1) { clearGlow(); return; }
        const peak = flash ? 0.12 : 0.35;
        const alpha = t < peak ? t / peak : 1 - (t - peak) / (1 - peak);
        if (G.style === 'ring') {
          item.scale.setScalar(0.05 + t * 0.9 * G.size);
          item.material.opacity = 1 - t;
        } else {
          const base = 0.6 * G.size * (flash ? 1.6 : 1);
          const grow = 1 + t * (flash ? 0.8 : 1.6) * G.size;
          item.scale.set(base * grow, base * grow, 1);
          item.material.opacity = Math.max(0, alpha);
        }
        requestAnimationFrame(step);
      })(t0);
    }

    /* ---- render loop ---- */
    let last = performance.now();
    function frame(now) {
      if (!running) return;
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!st.dragging) {
        const k = 1 - Math.exp(-CONFIG.returnSpeed * dt);
        st.yaw -= st.yaw * k;
        st.pitch -= st.pitch * k;
      }
      rig.rotation.set(st.pitch, st.yaw, 0, 'XYZ');
      renderer.render(scene, camera);
    }
  })();

  /* ============================================================
     SCENE 2 & 3 — letter pages, lightbox, cake
     ============================================================ */
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  document.getElementById('pages').addEventListener('click', (e) => {
    if (e.target.classList.contains('ink-overlay')) { lightboxImg.src = e.target.src; lightbox.classList.add('open'); }
  });
  function closeLightbox() { lightbox.classList.remove('open'); }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  const cakeBtn = document.getElementById('cake-btn');
  const birthdaySticky = document.getElementById('birthday-sticky');
  const tapHint = document.getElementById('tap-hint');
  const letterSection = document.getElementById('letter-section');
  const flameGlow = document.getElementById('flame-glow');
  const cakePhoto = document.getElementById('cake-photo');

  cakeBtn.addEventListener('click', () => {
    birthdaySticky.classList.add('lit');
    cakePhoto.style.opacity = '1';
    tapHint.style.opacity = '0';
  });

  let ticking = false;
  function updateScrollScenes() {
    ticking = false;
    const vh = window.innerHeight;
    const letterBottom = letterSection.offsetTop + letterSection.offsetHeight;
    const y = window.scrollY;

    const fadeStart = letterBottom - vh * 0.9;
    const fadeEnd = letterBottom + vh * 0.15;
    let lp = Math.max(0, Math.min(1, (y - fadeStart) / (fadeEnd - fadeStart)));
    letterSection.style.opacity = String(1 - lp);
    letterSection.style.pointerEvents = lp > 0.6 ? 'none' : 'auto';

    const revealStart = fadeEnd;
    const revealEnd = revealStart + vh * 0.9;
    let rp = Math.max(0, Math.min(1, (y - revealStart) / (revealEnd - revealStart)));
    flameGlow.style.opacity = String(Math.min(1, rp * 2.2));
    if (!birthdaySticky.classList.contains('lit')) cakePhoto.style.opacity = String(rp);
  }
  document.addEventListener('scroll', () => {
    if (!ticking) { window.requestAnimationFrame(updateScrollScenes); ticking = true; }
  });
  window.addEventListener('resize', updateScrollScenes);
  updateScrollScenes();
</script>
</body>
</html>
